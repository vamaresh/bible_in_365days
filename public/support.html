<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bible Reading Challenge Support</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        margin: 0;
        color: #1f2937;
        background: #f8fafc;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      h1 {
        color: #312e81;
      }
      .panel {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bible Reading Challenge Support</h1>
      <div class="panel">
        <p>For help with reading progress, reminders, account deletion, reading circles, or App Store support, contact the app owner.</p>
        <p>Before submitting to the App Store, replace this placeholder with the church or organization support email address.</p>
      </div>
    </main>
  </body>
</html>
